# Full deployment on one machine with an NVIDIA GPU (see docs: "Tech stack and deployment").
# Local development on a Mac does not need this file: see README.md.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://video:video@postgres:5432/videointel
  REDIS_URL: redis://redis:6379/0
  TASK_MODE: celery
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  VLM_BASE_URL: http://vlm:8000/v1
  VLM_MODEL: Qwen/Qwen3-VL-8B-Instruct
  WORK_DIR: /work

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_USER: video, POSTGRES_PASSWORD: video, POSTGRES_DB: videointel}
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  vlm:
    image: vllm/vllm-openai:latest
    command: ["--model", "Qwen/Qwen3-VL-8B-Instruct", "--max-model-len", "32768",
              "--limit-mm-per-prompt", '{"image": 20}', "--gpu-memory-utilization", "0.55"]
    volumes: [hfcache:/root/.cache/huggingface]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    depends_on: [postgres, redis, minio]
    volumes: [work:/work]
    ports: ["8010:8000"]

  worker-cpu:
    build: ./backend
    command: celery -A worker.celery_app worker -Q cpu --concurrency 2
    environment: *backend-env
    depends_on: [postgres, redis, minio]
    volumes: [work:/work]

  worker-gpu:
    build: ./backend
    command: celery -A worker.celery_app worker -Q gpu --concurrency 1 --pool solo
    environment: *backend-env
    depends_on: [postgres, redis, minio, vlm]
    volumes: [work:/work, hfcache:/root/.cache/huggingface]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes: {pgdata: {}, miniodata: {}, hfcache: {}, work: {}}
