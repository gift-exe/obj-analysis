[project]
name = "video-intel"
version = "0.1.0"
description = "Video analysis platform: ingest once into a video memory, answer questions with an evidence-grounded agent."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "scenedetect>=0.6.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "boto3>=1.35",
    "pillow>=10.4",
]

[project.optional-dependencies]
# Models that run in the worker. Kept optional so the API can run on a machine without them.
ml = [
    "torch>=2.4",
    "transformers>=4.46",
    "sentence-transformers>=3.2",
    "ultralytics>=8.3",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "faster-whisper>=1.0",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "lap>=0.5",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
